                   q-25 0 -42 -11 q-22 -14 -22 -56 Z" fill="#35695F"></path><path d="M56 96 q0 42 22 56 q8 5 18 8 q-30 -30 -24 -80 q-16 6 -16 16 Z" fill="#20443E" opacity="0.55"></path><path d="M104 134 q15 9 29 -4" fill="none" stroke="#2E2018" stroke-width="5" stroke-linecap="round"></path><g><path d="M68 68 q5 -56 52 -56 q47 0 52 56 Z" fill="#C6AF90"></path><path d="M68 68 q5 -56 52 -56 q-17 15 -22 56 Z" fill="#A88F6E" opacity="0.55"></path><path d="M70 57 q50 13 100 0 l0 11 q-50 13 -100 0 Z" fill="#35695F"></path><ellipse cx="120" cy="70" rx="76" ry="16" fill="#C6AF90"></ellipse><path d="M44 70 q76 21 152 0 q-76 11 -152 0 Z" fill="#A88F6E" opacity="0.5"></path></g></g><g><rect x="66" y="84" width="44" height="54" rx="18" fill="#6E5B44"></rect><rect x="130" y="84" width="44" height="54" rx="18" fill="#6E5B44"></rect><rect x="74" y="90" width="11" height="44" rx="5.5" fill="#8E7757" opacity=".5"></rect><rect x="138" y="90" width="11" height="44" rx="5.5" fill="#8E7757" opacity=".5"></rect><rect x="104" y="96" width="32" height="18" rx="7" fill="#8E7757"></rect><rect x="113" y="88" width="14" height="36" rx="6" fill="#5C4B39"></rect><g><circle cx="88" cy="108" r="19" fill="#4E3F30"></circle><circle cx="88" cy="108" r="14.5" fill="#1F3B36"></circle><circle cx="88" cy="108" r="14.5" fill="none" stroke="#5E8A7E" stroke-width="1.6" opacity=".5"></circle><ellipse cx="84.5" cy="103" rx="9" ry="4.2" fill="#CFE3DA" opacity=".30" transform="rotate(-38 84.5 103)"></ellipse><ellipse cx="92" cy="114" rx="5" ry="2.4" fill="#CFE3DA" opacity=".16" transform="rotate(-38 92 114)"></ellipse><circle cx="80.5" cy="100.5" r="2.4" fill="#F7F3E8" opacity=".6"></circle></g><g><circle cx="152" cy="108" r="19" fill="#4E3F30"></circle><circle cx="152" cy="108" r="14.5" fill="#1F3B36"></circle><circle cx="152" cy="108" r="14.5" fill="none" stroke="#5E8A7E" stroke-width="1.6" opacity=".5"></circle><ellipse cx="148.5" cy="103" rx="9" ry="4.2" fill="#CFE3DA" opacity=".30" transform="rotate(-38 14