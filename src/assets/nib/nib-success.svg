                  Q-2.24 2.24 -8 0 Q-2.24 -2.24 0 -8 Z"></path><path transform="translate(208 126)" fill="#46E08B" opacity="0.9" style="animation-delay:0.22s" d="M0 -7 Q1.9600000000000002 -1.9600000000000002 7 0 Q1.9600000000000002 1.9600000000000002 0 7
