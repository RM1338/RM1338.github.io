                   q-25 0 -42 -11 q-22 -14 -22 -56 Z" fill="#35695F"></path><path d="M56 96 q0 42 22 56 q8 5 18 8 q-30 -30 -24 -80 q-16 6 -16 16 Z" fill="#20443E" opacity="0.55"></path><g><path d="M76 104 q18 -20 36 0" fill="none" stroke="#1B3B36" stroke-width="7" stroke-linecap="round"></path><path d="M128 104 q18 -20 36 0" fill="none" stroke="#1B3B36" stroke-width="7" stroke-linecap="round"></path><path d="M100 130 q20 22 40 0 q-20 8 -40 0 Z" fill="#2E2018"></path></g></g></g></svg>